trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'ZhehistovskyiAppConnection'
  webAppName: 'm-zhehistovskyi-web-app'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - script: dotnet restore ConferenceRoomBooking.sln
    displayName: 'Restore solution'

  - script: dotnet build ConferenceRoomBooking.sln --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'

  - script: dotnet publish ConferenceRoomBooking.Web/ConferenceRoomBooking.Web.csproj --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/publish
    displayName: 'Publish Web API'

  - task: ArchiveFiles@2
    displayName: 'Zip files'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/ConferenceRoomBooking.zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/ConferenceRoomBooking.zip'
      ArtifactName: 'drop'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webApp'
      appName: '$(webAppName)'
      package: '$(Build.ArtifactStagingDirectory)/ConferenceRoomBooking.zip'
      deploymentMethod: 'auto'